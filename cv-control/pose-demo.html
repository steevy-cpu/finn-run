p<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pose Rig Demo</title>
    <style>
        body {
            margin: 0;
            background: #111418;
            color: #e8eaed;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 24px;
        }
        h1 { margin: 0; font-size: 22px; }
        #stage {
            position: relative;
            /* Mirror so it behaves like a mirror for the player */
            transform: scaleX(-1);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,.5);
        }
        #video { display: block; }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
        }
        #status { font-size: 15px; color: #9aa0a6; }
        #fps { color: #00e676; font-variant-numeric: tabular-nums; }
    </style>
</head>
<body>
    <h1>Milestone 2 — Pose Rig Demo</h1>
    <div id="status">Starting…</div>
    <div id="stage">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
    </div>
    <div id="fps"></div>

    <script type="module">
        import { PoseEngine } from "./pose.js";

        const statusEl = document.getElementById("status");
        const fpsEl = document.getElementById("fps");

        const engine = new PoseEngine({
            video: document.getElementById("video"),
            canvas: document.getElementById("overlay"),
            onStatus: msg => { statusEl.textContent = msg; console.log("[PoseDemo]", msg); },
            onResults: (landmarks, fps) => {
                fpsEl.textContent = `${fps} fps — ${landmarks ? "body tracked" : "no body detected"}`;
            },
        });

        try {
            await engine.init();
            engine.start();
            console.log("[PoseDemo] engine running");
        } catch (err) {
            statusEl.textContent = "Error: " + err.message;
            console.error("[PoseDemo] init failed", err);
        }
    </script>
</body>
</html>
